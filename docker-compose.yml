services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: farmaconsulta
      POSTGRES_PASSWORD: farmaconsulta
      POSTGRES_DB: farmaconsulta
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmaconsulta"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://farmaconsulta:farmaconsulta@db:5432/farmaconsulta
      JWT_SECRET: dev-secret-cambiar-en-produccion
      JWT_EXPIRE_MINUTES: 600
      FRONTEND_URL: http://localhost:5173
      ENV: development
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
