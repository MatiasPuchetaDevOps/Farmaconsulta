services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmaconsulta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copiá .env.example a .env y definí POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-farmaconsulta}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmaconsulta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-farmaconsulta}:${POSTGRES_PASSWORD:?Copiá .env.example a .env y definí POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-farmaconsulta}
      JWT_SECRET: ${JWT_SECRET:?Copiá .env.example a .env y definí JWT_SECRET (openssl rand -hex 32)}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-600}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ENV: ${ENV:-development}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
